name: v46t-current-observation
on:
  push:
    branches: [feature/v46t-current-observation]
    paths:
      - tools/apply_v46t_current_observation.py
      - tools/v46t_current_observation_contract.py
      - tools/test_v46t_current_observation.py
      - .github/workflows/v46t-current-observation.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact logging-only correction and run retained regressions
        run: |
          set -euxo pipefail
          python tools/apply_v46t_current_observation.py
          python tools/test_v46t_current_observation.py
          python tools/test_v46s_solver_audit.py
          python tools/test_current_audit_source_guards.py
          python tools/test_v46g_highrate_source_guards.py
          python tools/test_v46i_task_split_source_guards.py
          python tools/test_rwlog_v46_converter.py
          g++ -std=c++11 -O2 tools/test_v46n_acquisition.cpp -o /tmp/acq
          /tmp/acq
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46o_startup.cpp -o /tmp/startup
          /tmp/startup
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46p_run_control.cpp -o /tmp/control
          /tmp/control
          g++ -std=c++17 -O2 tools/test_mekf_host.cpp src/mekf6.cpp -o /tmp/mekf
          /tmp/mekf
      - name: Build actual ESP32-S3 firmware
        run: |
          pip install platformio
          pio run -e atoms3cam
      - name: Commit only the tested application changes
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools site docs
          git diff --cached --check
          git commit -m 'Fix repeated current-age race with one snapshot before its reference clock'
          git push origin HEAD:feature/v46t-current-observation
          mkdir -p verified
          git rev-parse HEAD > verified/source-sha.txt
          cp .pio/build/atoms3cam/{firmware.bin,firmware.elf} verified/
      - uses: actions/upload-artifact@v4
        with:
          name: v46t-tested-source
          path: verified/
          retention-days: 7
