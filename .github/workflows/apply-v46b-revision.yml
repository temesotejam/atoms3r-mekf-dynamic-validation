name: apply-v46b-revision

on:
  push:
    paths:
      - .github/workflows/apply-v46b-revision.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark upright-reinit attitude revision
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/config.h')
          text = p.read_text(encoding='utf-8')
          old = 'v46_mekf_adopted_dynamic_beta_compare_20260912'
          new = 'v46b_mekf_upright_reinit_dynamic_beta_compare_20260913'
          assert old in text or new in text
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'v46b_mekf_upright_reinit_dynamic_beta_compare_20260913' src/config.h
      - name: Commit revision marker
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config.h
          git commit -m "Mark V46b upright-reinit attitude revision"
          git push origin HEAD:main
