name: apply-v46e-core

on:
  push:
    paths:
      - .github/workflows/apply-v46e-core.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V46e proper-frame patch
        run: |
          python tools/apply_v46e_proper_frame_patch.py
          python tools/finalize_v46e_proper_frame_patch.py
          git diff --check
          python tools/test_v46_motor_validation_source_guards.py
          g++ -std=c++17 -O2 tools/test_mekf_host.cpp src/mekf6.cpp -o /tmp/test_mekf_host
          /tmp/test_mekf_host
      - name: Commit V46e core patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config.h src/experiment_runner.cpp src/experiment_runner.h src/main.cpp \
                  tools/test_mekf_host.cpp tools/test_v46_motor_validation_source_guards.py \
                  site/index.html site/manifest.json \
                  docs/MEKF_DYNAMIC_COMPARE_V46.md docs/FIRST_V46_DYNAMIC_VALIDATION.md
          git commit -m "Use physical Ry180 body frame for V46e MEKF"
          git push origin HEAD:main
