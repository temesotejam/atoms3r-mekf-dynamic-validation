name: v46s-audit-integration
on:
  push:
    branches: [feature/v46s-solver-audit]
    paths:
      - '.github/workflows/v46s-audit-integration.yml'
      - 'tools/apply_v46s_solver_audit.py'
      - 'tools/finalize_v46s_storage.py'
permissions:
  contents: write
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact source snapshot for review
        run: |
          mkdir -p /tmp/source-snapshot
          git archive HEAD | tar -x -C /tmp/source-snapshot
          git rev-parse HEAD > /tmp/source-snapshot/review-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v46s-source-snapshot
          path: /tmp/source-snapshot/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and test audit-only change
        run: |
          set -euxo pipefail
          if ! grep -q 'v46s_solver_audit_20260915' src/config.h; then
            python tools/apply_v46s_solver_audit.py
          fi
          if ! grep -q 'audit_psram_allocation_failed' src/psram_logger.cpp; then
            python tools/finalize_v46s_storage.py
          fi
          python tools/test_v46s_solver_audit.py
          python tools/test_current_audit_source_guards.py
          python tools/test_v46g_highrate_source_guards.py
          python tools/test_v46i_task_split_source_guards.py
          python tools/test_rwlog_v46_converter.py
          g++ -std=c++11 -O2 tools/test_v46n_acquisition.cpp -o /tmp/acq
          /tmp/acq
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46o_startup.cpp -o /tmp/startup
          /tmp/startup
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46p_run_control.cpp -o /tmp/control
          /tmp/control
          g++ -std=c++17 -O2 tools/test_mekf_host.cpp src/mekf6.cpp -o /tmp/mekf
          /tmp/mekf
          pip install platformio
          pio run -e atoms3cam
      - name: Commit tested application changes
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools site docs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Keep tested V46s audit storage in PSRAM without changing control'
            git push origin HEAD:feature/v46s-solver-audit
          fi
      - name: Preserve tested source and firmware
        run: |
          mkdir -p /tmp/tested-source/source /tmp/tested-source/firmware
          git archive HEAD | tar -x -C /tmp/tested-source/source
          git rev-parse HEAD > /tmp/tested-source/source-sha.txt
          cp .pio/build/atoms3cam/{firmware.bin,firmware.elf} /tmp/tested-source/firmware/
      - uses: actions/upload-artifact@v4
        with:
          name: v46s-tested-source
          path: /tmp/tested-source/
          include-hidden-files: true
          retention-days: 7
