name: import-v46-debug

on:
  push:
    branches: ["feature/v46-mekf-dynamic-validation"]
    paths:
      - ".import/DEBUG"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify payload SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          parts=sorted(Path('.import').glob('minhex_*'))
          data=bytes.fromhex(''.join(p.read_text(encoding='ascii').strip() for p in parts))
          actual=hashlib.sha256(data).hexdigest()
          expected='a1206de153b9ebc42e7ac57560f605332fd39ddf15da248d4584bea50d289483'
          print(actual, len(data))
          assert actual==expected
          Path('/tmp/v46.tar.xz').write_bytes(data)
          PY

      - name: Extract V46
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v46 && mkdir -p /tmp/v46
          tar -xJf /tmp/v46.tar.xz -C /tmp/v46
          test -f /tmp/v46/src/experiment_runner.cpp
          test -f /tmp/v46/src/mekf6.cpp

      - name: Replace working tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/v46/. .
          rm -rf .import
          cat > .gitignore <<'EOF'
          .pio/
          .vscode/
          __pycache__/
          *.pyc
          *.log
          EOF
          git status --short | head -200

      - name: Create local commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import audited V46 MEKF dynamic validation firmware"
          git log -1 --oneline

      - name: Push imported commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
