name: build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify V46aj timing, current observation and retained controller envelope
        run: |
          set -euxo pipefail
          python tools/test_v46u_timing.py
          python tools/test_v46t_current_observation.py
          python tools/test_v46r_fast_solver_control.py
          python tools/test_v46s_solver_audit.py
          python tools/test_current_audit_source_guards.py
          python tools/test_v46g_highrate_source_guards.py
          python tools/test_v46i_task_split_source_guards.py
          python tools/test_rwlog_v46_converter.py
          python tools/test_v46z_comparison_zero.py
          python tools/test_v46aa_control_zero.py
          python tools/test_v46ab_no_prediction.py
          python tools/test_v46ac_delay_compensation.py
          python tools/test_v46aj_fixed_timing.py
          python tools/test_v46ae_mekf_amplitude.py
          python tools/test_v46ai_rate_only.py
      - name: Run retained native acquisition, startup, control and MEKF tests
        run: |
          set -euxo pipefail
          g++ -std=c++11 -O2 tools/test_v46n_acquisition.cpp -o /tmp/test_acq
          /tmp/test_acq
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46o_startup.cpp -o /tmp/test_v46o
          /tmp/test_v46o
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46p_run_control.cpp -o /tmp/test_v46p
          /tmp/test_v46p
          g++ -std=c++17 -O2 tools/test_mekf_host.cpp src/mekf6.cpp -o /tmp/test_mekf
          /tmp/test_mekf
          python -m json.tool site/manifest.json >/dev/null
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build V46aj firmware with verified BMI270 transport patch
        run: |
          set -euxo pipefail
          pio pkg install -e atoms3cam
          pio run -e atoms3cam
          test -s bmi270-build-patch.json
          cat bmi270-build-patch.json
      - name: Package flash images and driver provenance
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp .pio/build/atoms3cam/{bootloader.bin,partitions.bin,firmware.bin,firmware.elf} dist/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" dist/
          cp bmi270-build-patch.json dist/
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin -o dist/merged-firmware.bin 0x0000 dist/bootloader.bin 0x8000 dist/partitions.bin 0xe000 dist/boot_app0.bin 0x10000 dist/firmware.bin
          printf '%s\n' "$GITHUB_SHA" > dist/build-sha.txt
          printf '%s\n' 'V46aj 0.46.35; frozen 1ms BMI270 acquisition; posterior MEKF amplitude with expected-side peak rearm and live-bias-corrected rate; fixed 3ms zero-cross compensation; no timing selector or setting API; legacy gyro-coordinate side fit disabled; rate-only baseline from first accepted zero-cross for all target settings; no previous-peak predictor or P1 fallback; negative formula floored at zero; heavy Autonomous quaternion prediction disabled; output envelope and ESTOP retained' > dist/FLASH_LAYOUT.txt
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: atoms3r-v46aj-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
