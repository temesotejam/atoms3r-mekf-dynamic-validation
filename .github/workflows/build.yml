name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build AtomS3R firmware
        run: pio run -e atoms3r
