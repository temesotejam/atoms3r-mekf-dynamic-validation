name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build AtomS3R firmware
        run: pio run -e atoms3r

      - name: Validate web JavaScript
        run: node --check site/app.js

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/firmware
          cp -R site/. _site/
          cp .pio/build/atoms3r/bootloader.bin _site/firmware/bootloader.bin
          cp .pio/build/atoms3r/partitions.bin _site/firmware/partitions.bin
          cp .pio/build/atoms3r/firmware.bin _site/firmware/firmware.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -type f -name boot_app0.bin | head -n 1)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" _site/firmware/boot_app0.bin
          python -m json.tool _site/manifest.json >/dev/null
          test -s _site/firmware/bootloader.bin
          test -s _site/firmware/partitions.bin
          test -s _site/firmware/boot_app0.bin
          test -s _site/firmware/firmware.bin

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
