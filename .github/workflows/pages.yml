name: pages

on:
  push:
    branches: [main, "feature/v46-mekf-dynamic-validation"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Validate V46i web files
        run: |
          test -s site/index.html
          test -s site/styles.css
          python -m json.tool site/manifest.json >/dev/null
          grep -q "V46i MEKF Motor Validation" site/index.html
          grep -q "v46i_mekf_400hz_dual_core_roller_queue_20260913" site/index.html
          grep -q '"version": "0.46.8"' site/manifest.json

      - name: Run V46i high-rate guard
        run: python tools/test_v46g_highrate_source_guards.py

      - name: Run V46i task-split guard
        run: python tools/test_v46i_task_split_source_guards.py

      - name: Build V46i AtomS3R firmware
        run: pio run -e atoms3cam

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/firmware
          cp -R site/. _site/
          cp .pio/build/atoms3cam/bootloader.bin _site/firmware/bootloader.bin
          cp .pio/build/atoms3cam/partitions.bin _site/firmware/partitions.bin
          cp .pio/build/atoms3cam/firmware.bin _site/firmware/firmware.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -type f -name boot_app0.bin | head -n 1)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" _site/firmware/boot_app0.bin
          printf '%s\n' "$GITHUB_SHA" > _site/build-sha.txt
          python -m json.tool _site/manifest.json >/dev/null
          test -s _site/firmware/bootloader.bin
          test -s _site/firmware/partitions.bin
          test -s _site/firmware/boot_app0.bin
          test -s _site/firmware/firmware.bin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
