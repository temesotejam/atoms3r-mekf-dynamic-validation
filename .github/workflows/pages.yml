name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify V46q release and retained motor guards
        run: |
          python tools/test_v46n_acquisition_source.py
          python tools/test_current_audit_source_guards.py
          python tools/test_v46_motor_validation_source_guards.py
          python tools/test_v46g_highrate_source_guards.py
          python tools/test_v46i_task_split_source_guards.py
          python tools/test_v46k_timing_probe_source_guards.py
          python tools/test_v46l_fast_solver_shadow.py
          python tools/test_rwlog_v46_converter.py
          g++ -std=c++11 -O2 tools/test_v46n_acquisition.cpp -o /tmp/test_acq
          /tmp/test_acq
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46o_startup.cpp -o /tmp/test_v46o
          /tmp/test_v46o
          python tools/test_v46p_run_control_source.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Itools/host_v46o tools/test_v46p_run_control.cpp -o /tmp/test_v46p
          /tmp/test_v46p
          python -m json.tool site/manifest.json >/dev/null
          grep -q 'v46q_lightweight_acquisition_20260914' site/index.html
      - name: Verify V46q lightweight acquisition and timing profile
        run: python tools/run_v46q_tests.py
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build V46q motor-driven firmware
        run: pio run -e atoms3cam
      - name: Assemble verified web flasher
        run: |
          set -euxo pipefail
          mkdir -p _site/firmware
          cp -R site/. _site/
          cp .pio/build/atoms3cam/{bootloader.bin,partitions.bin,firmware.bin} _site/firmware/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" _site/firmware/
          printf '%s\n' "$GITHUB_SHA" > _site/build-sha.txt
          (cd _site/firmware && sha256sum *.bin > SHA256SUMS.txt)
          git diff --exit-code
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
