name: import-v46

on:
  push:
    branches: ["feature/v46-mekf-dynamic-validation"]
    paths:
      - ".import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify audited V46 payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          parts = sorted(Path('.import').glob('minhex_*'))
          if not parts:
              raise SystemExit('no minhex parts found')
          hex_text = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          data = bytes.fromhex(hex_text)
          expected = 'a1206de153b9ebc42e7ac57560f605332fd39ddf15da248d4584bea50d289483'
          actual = hashlib.sha256(data).hexdigest()
          print('PAYLOAD SHA256:', actual)
          print('PAYLOAD BYTES:', len(data))
          if actual != expected:
              raise SystemExit(f'payload SHA mismatch: {actual} != {expected}')
          Path('/tmp/v46_payload.tar.xz').write_bytes(data)
          PY

      - name: Extract and validate V46 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v46
          mkdir -p /tmp/v46
          tar -xJf /tmp/v46_payload.tar.xz -C /tmp/v46
          test -f /tmp/v46/src/experiment_runner.cpp
          test -f /tmp/v46/src/mekf6.cpp
          test -f /tmp/v46/tools/convert_rwlog_to_csv.py
          test -f /tmp/v46/tools/test_mekf_host.cpp
          test -f /tmp/v46/tools/test_rwlog_v46_converter.py
          test -f /tmp/v46/docs/MEKF_DYNAMIC_COMPARE_V46.md
          test -f /tmp/v46/FINAL_PROGRAM_AUDIT_V46.md
          echo "V46 tree validated"

      - name: Import V46 source tree
        shell: bash
        run: |
          set -euo pipefail
          # Preserve .git and the already-authorized workflow files. Everything
          # else is replaced by the audited V46 payload. Workflow cleanup is
          # performed separately through the GitHub connector after this push.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/v46/. .
          rm -rf .import
          cat > .gitignore <<'EOF'
          .pio/
          .vscode/
          __pycache__/
          *.pyc
          *.log
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import audited V46 MEKF dynamic validation firmware"
          git push origin HEAD:${GITHUB_REF_NAME}
