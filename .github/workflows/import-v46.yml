name: import-v46

on:
  push:
    branches: ["feature/v46-mekf-dynamic-validation"]
    paths:
      - ".import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Reconstruct audited V46 repository payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.import').glob('minhex_*'))
          if not parts:
              raise SystemExit('no minhex parts found')
          hex_text = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          data = bytes.fromhex(hex_text)
          expected = 'a1206de153b9ebc42e7ac57560f605332fd39ddf15da248d4584bea50d289483'
          actual = hashlib.sha256(data).hexdigest()
          print('PAYLOAD SHA256:', actual)
          if actual != expected:
              raise SystemExit(f'payload SHA mismatch: {actual} != {expected}')
          Path('/tmp/v46_payload.tar.xz').write_bytes(data)
          PY

          rm -rf /tmp/v46
          mkdir -p /tmp/v46
          tar -xJf /tmp/v46_payload.tar.xz -C /tmp/v46
          test -f /tmp/v46/src/experiment_runner.cpp
          test -f /tmp/v46/src/mekf6.cpp
          test -f /tmp/v46/tools/convert_rwlog_to_csv.py
          test -f /tmp/v46/docs/MEKF_DYNAMIC_COMPARE_V46.md

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v46/. .

          cat > .gitignore <<'EOF'
          .pio/
          .vscode/
          __pycache__/
          *.pyc
          *.log
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'YAML'
          name: build-and-regression

          on:
            push:
              branches: [main, "feature/**"]
            pull_request:

          jobs:
            firmware-and-tests:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.x"
                - name: Install PlatformIO
                  run: pip install --upgrade platformio
                - name: Build AtomS3 firmware
                  run: pio run -e atoms3cam
                - name: MEKF native host test
                  run: |
                    g++ -std=c++17 -O2 -Isrc tools/test_mekf_host.cpp src/mekf6.cpp -o /tmp/test_mekf
                    /tmp/test_mekf
                - name: RWLOG converter regressions
                  run: |
                    python tools/test_rwlog_v42_converter.py
                    python tools/test_rwlog_v45_converter.py
                    python tools/test_rwlog_v46_converter.py
                - name: Control and safety regressions
                  run: |
                    python tools/test_current_audit_source_guards.py
                    python tools/test_energy_control_autonomous_v1.py
                    python tools/test_energy_control_autonomous_v5_metadata.py
                    python tools/test_energy_control_v0.py
                    python tools/test_energy_control_v01_protocol.py
                    python tools/test_q1_shadow_logic.py
                    python tools/test_q_ident_protocol.py
                    python tools/test_e2_shadow_logic.py
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import audited V46 MEKF dynamic validation firmware"
          git push origin HEAD:${GITHUB_REF_NAME}
