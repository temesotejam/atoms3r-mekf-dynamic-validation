name: import-v46

on:
  push:
    branches: ["feature/v46-mekf-dynamic-validation"]
    paths:
      - ".import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Reconstruct audited V46 package from text bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v46_out
          mkdir -p /tmp/v46_out
          python - <<'PY'
          import json
          from pathlib import Path

          bundle_dir = Path('.import')
          out = Path('/tmp/v46_out')
          pieces = {}
          for bundle in sorted(bundle_dir.glob('bundle_*.jsonl')):
              for line_no, line in enumerate(bundle.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  rec = json.loads(line)
                  path = Path(rec['path'])
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path in {bundle}:{line_no}: {path}')
                  pieces.setdefault(path.as_posix(), {})[int(rec['index'])] = rec['content']

          for rel, chunks in pieces.items():
              expected = list(range(len(chunks)))
              actual = sorted(chunks)
              if actual != expected:
                  raise SystemExit(f'missing chunk(s) for {rel}: {actual}')
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(''.join(chunks[i] for i in expected), encoding='utf-8')
          print(f'reconstructed {len(pieces)} files')
          PY

          (cd /tmp/v46_out && sha256sum -c "$GITHUB_WORKSPACE/.import/SHA256SUMS")
          test -f /tmp/v46_out/src/experiment_runner.cpp
          test -f /tmp/v46_out/src/mekf6.cpp
          test -f /tmp/v46_out/tools/convert_rwlog_to_csv.py
          test -f /tmp/v46_out/docs/MEKF_DYNAMIC_COMPARE_V46.md

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v46_out/. .

          cat > .gitignore <<'EOF'
          .pio/
          .vscode/
          __pycache__/
          *.pyc
          *.log
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'YAML'
          name: build-and-regression

          on:
            push:
              branches: [main, "feature/**"]
            pull_request:

          jobs:
            firmware-and-tests:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.x"
                - name: Install PlatformIO
                  run: pip install --upgrade platformio
                - name: Build AtomS3 firmware
                  run: pio run -e atoms3cam
                - name: MEKF native host test
                  run: |
                    g++ -std=c++17 -O2 -Isrc tools/test_mekf_host.cpp src/mekf6.cpp -o /tmp/test_mekf
                    /tmp/test_mekf
                - name: RWLOG converter regressions
                  run: |
                    python tools/test_rwlog_v42_converter.py
                    python tools/test_rwlog_v45_converter.py
                    python tools/test_rwlog_v46_converter.py
                - name: Control and safety regressions
                  run: |
                    python tools/test_current_audit_source_guards.py
                    python tools/test_energy_control_autonomous_v1.py
                    python tools/test_energy_control_autonomous_v5_metadata.py
                    python tools/test_energy_control_v0.py
                    python tools/test_energy_control_v01_protocol.py
                    python tools/test_q1_shadow_logic.py
                    python tools/test_q_ident_protocol.py
                    python tools/test_e2_shadow_logic.py
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import audited V46 MEKF dynamic validation firmware"
          git push origin HEAD:${GITHUB_REF_NAME}
