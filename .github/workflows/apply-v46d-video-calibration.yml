name: apply-v46d-video-calibration

on:
  push:
    paths:
      - .github/workflows/apply-v46d-video-calibration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V46d video calibration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              assert s.count(old) == 1, (path, s.count(old), old)
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Keep the internal/control MEKF coordinate unchanged. Only the
          # comparison output is mapped to the empirically calibrated video
          # amplitude/sign convention.
          replace_one(
              'src/config.h',
              'static constexpr char ATTITUDE_VALIDATION_REVISION[] = "v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913";\n',
              'static constexpr char ATTITUDE_VALIDATION_REVISION[] = "v46d_mekf_video_calibrated_rx180_upright_reinit_20260913";\n'
              'static constexpr float MEKF_VIDEO_OUTPUT_SIGN = -1.0f;\n'
              'static constexpr float MEKF_VIDEO_OUTPUT_SCALE = 0.908911f;\n'
          )
          p = Path('src/experiment_runner.cpp')
          s = p.read_text(encoding='utf-8')
          old = '  status_.pitch_mekf_abs_deg = raw_mekf_pitch_abs_deg_;\n'
          new = ('  status_.pitch_mekf_abs_deg = Config::MEKF_VIDEO_OUTPUT_SIGN *\n'
                 '      Config::MEKF_VIDEO_OUTPUT_SCALE * raw_mekf_pitch_abs_deg_;\n')
          assert s.count(old) == 2, s.count(old)
          p.write_text(s.replace(old, new), encoding='utf-8')

          replace_one(
              'src/experiment_runner.h',
              '  float pitch_mekf_abs_deg = 0.0f;          // continuous gravity-frame MEKF pitch coordinate\n',
              '  float pitch_mekf_abs_deg = 0.0f;          // video-calibrated MEKF comparison coordinate; control is unchanged\n'
          )
          replace_one('src/main.cpp', 'V46c MEKF motor-driven dynamic validation', 'V46d MEKF motor-driven dynamic validation')
          replace_one('src/main.cpp', 'V46c identity:', 'V46d identity:')
          replace_one('src/main.cpp', 'displayLine("V46c MEKF", "V7 MOTOR VALIDATION");', 'displayLine("V46d MEKF", "V7 MOTOR VALIDATION");')

          # Source guard: prove the video calibration cannot silently enter the
          # adopted control/detector coordinate.
          p = Path('tools/test_v46_motor_validation_source_guards.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913" in config',
                        '"v46d_mekf_video_calibrated_rx180_upright_reinit_20260913" in config')
          s = s.replace('"V46c MEKF motor-driven dynamic validation" in main_cpp',
                        '"V46d MEKF motor-driven dynamic validation" in main_cpp')
          anchor = '    assert "pitch_madgwick_dynamic_abs_deg" in runner\n'
          assert anchor in s
          addition = (
              '    assert "MEKF_VIDEO_OUTPUT_SCALE = 0.908911f" in config\n'
              '    assert "MEKF_VIDEO_OUTPUT_SIGN = -1.0f" in config\n'
              '    assert runner.count("Config::MEKF_VIDEO_OUTPUT_SCALE * raw_mekf_pitch_abs_deg_") == 2\n'
              '    assert "status_.pitch_mekf_deg = raw_mekf_pitch_abs_deg_ - offset_mekf_pitch_deg_" in runner\n'
          )
          s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s, encoding='utf-8')

          # CI / Pages identity and artifact labels.
          p = Path('.github/workflows/build.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('V46c', 'V46d').replace('v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913',
                                                'v46d_mekf_video_calibrated_rx180_upright_reinit_20260913')
          s = s.replace('atoms3r-v46c-mekf-rx180-upright-reinit-', 'atoms3r-v46d-mekf-video-calibrated-')
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/pages.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('V46c', 'V46d').replace('v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913',
                                                'v46d_mekf_video_calibrated_rx180_upright_reinit_20260913')
          p.write_text(s, encoding='utf-8')

          # Web flasher copy and manifest.
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('V46c', 'V46d').replace('v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913',
                                                'v46d_mekf_video_calibrated_rx180_upright_reinit_20260913')
          s = s.replace('MEKF と dynamic-beta Madgwick を同時記録する V46d ファームウェアです。',
                        'MEKF と dynamic-beta Madgwick を同時記録する V46d ファームウェアです。動画比較用MEKF出力には既存の固定ホライズン校正係数0.908911を適用し、制御用MEKF座標は変更しません。')
          p.write_text(s, encoding='utf-8')

          p = Path('site/manifest.json')
          s = p.read_text(encoding='utf-8').replace('V46c', 'V46d').replace('0.46.2', '0.46.3')
          p.write_text(s, encoding='utf-8')

          # Comparison docs: make the coordinate semantics explicit.
          p = Path('docs/MEKF_DYNAMIC_COMPARE_V46.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| `pitch_mekf_abs_deg` | Continuous MEKF gravity-frame angle | No; video comparison |',
                        '| `pitch_mekf_abs_deg` | Video-calibrated MEKF comparison angle (`-0.908911 * internal MEKF pitch`) | No; video comparison |')
          p.write_text(s, encoding='utf-8')

          p = Path('docs/FIRST_V46_DYNAMIC_VALIDATION.md')
          s = p.read_text(encoding='utf-8')
          needle = '- `pitch_mekf_abs_deg`\n- `pitch_madgwick_dynamic_abs_deg`\n'
          if needle in s:
              s = s.replace(needle,
                  '- `pitch_mekf_abs_deg` (V46d: video-calibrated sign/amplitude; control MEKF is unchanged)\n- `pitch_madgwick_dynamic_abs_deg`\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -q 'MEKF_VIDEO_OUTPUT_SCALE = 0.908911f' src/config.h
          grep -q 'MEKF_VIDEO_OUTPUT_SIGN = -1.0f' src/config.h
          grep -q 'v46d_mekf_video_calibrated_rx180_upright_reinit_20260913' src/config.h
          test "$(grep -c 'Config::MEKF_VIDEO_OUTPUT_SCALE \* raw_mekf_pitch_abs_deg_' src/experiment_runner.cpp)" -eq 2
      - name: Commit V46d calibration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config.h src/experiment_runner.cpp src/experiment_runner.h src/main.cpp \
                  tools/test_v46_motor_validation_source_guards.py \
                  .github/workflows/build.yml .github/workflows/pages.yml \
                  site/index.html site/manifest.json \
                  docs/MEKF_DYNAMIC_COMPARE_V46.md docs/FIRST_V46_DYNAMIC_VALIDATION.md
          git commit -m "Calibrate V46d MEKF comparison output to video"
          git push origin HEAD:main
