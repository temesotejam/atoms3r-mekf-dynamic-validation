name: apply-v46c-body-frame

on:
  push:
    paths:
      - .github/workflows/apply-v46c-body-frame.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MEKF frame adapter and revision
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/experiment_runner.cpp')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '  return {r.ax_g, r.ay_g, r.az_g};': '  return {r.ax_g, -r.ay_g, -r.az_g};',
              '  return {mekf6::degToRad(-r.gx_dps), mekf6::degToRad(-r.gy_dps), mekf6::degToRad(-r.gz_dps)};': '  return {mekf6::degToRad(r.gx_dps), mekf6::degToRad(-r.gy_dps), mekf6::degToRad(-r.gz_dps)};',
              '  return {mekf6::degToRad(-bx_dps), mekf6::degToRad(-by_dps), mekf6::degToRad(-bz_dps)};': '  return {mekf6::degToRad(bx_dps), mekf6::degToRad(-by_dps), mekf6::degToRad(-bz_dps)};',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)
          old_mean = '      const mekf6::Vec3 mean_accel{\n          static_cast<float>(g_v46_mekf_run_reinit.ax_sum_g / n),\n          static_cast<float>(g_v46_mekf_run_reinit.ay_sum_g / n),\n          static_cast<float>(g_v46_mekf_run_reinit.az_sum_g / n)};\n'
          new_mean = '      const mekf6::Vec3 mean_accel_raw{\n          static_cast<float>(g_v46_mekf_run_reinit.ax_sum_g / n),\n          static_cast<float>(g_v46_mekf_run_reinit.ay_sum_g / n),\n          static_cast<float>(g_v46_mekf_run_reinit.az_sum_g / n)};\n      const mekf6::Vec3 mean_accel{\n          mean_accel_raw.x, -mean_accel_raw.y, -mean_accel_raw.z};\n'
          assert old_mean in text
          text = text.replace(old_mean, new_mean, 1)
          old_comment = '// Match the historical V45 detector coordinate without mixing spatial axes.\n// Accelerometer vectors remain in the raw M5Unified IMU frame so the static\n// pitch remains atan2(-ax,hypot(ay,az)). The MEKF quaternion kinematics use the\n// opposite angular-velocity sign convention to the legacy detector, therefore\n// all three gyro components (and their startup bias) are negated before predict.\n// This keeps a right-handed 3-D frame while making d(pitch)/dt agree with the\n// existing V45 detector convention pitch_rate = -gy.\n'
          new_comment = '// V46c sensor-to-body adapter: the installed AtomS3R has raw -Z upward at the\n// measured upright pose. Rotate raw IMU vectors 180 deg about +X, R=diag(+1,-1,-1).\n// This maps upright gravity to filter +Z, keeps a right-handed frame, preserves\n// the historical static pitch coordinate, and gives d(pitch)/dt = -raw_gy.\n'
          assert old_comment in text
          text = text.replace(old_comment, new_comment, 1)
          p.write_text(text, encoding='utf-8')

          c = Path('src/config.h')
          cfg = c.read_text(encoding='utf-8')
          old_rev = 'v46b_mekf_upright_reinit_dynamic_beta_compare_20260913'
          new_rev = 'v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913'
          assert old_rev in cfg
          c.write_text(cfg.replace(old_rev, new_rev, 1), encoding='utf-8')
          PY
          git diff --check
          grep -q 'return {r.ax_g, -r.ay_g, -r.az_g};' src/experiment_runner.cpp
          grep -q 'mean_accel_raw.x, -mean_accel_raw.y, -mean_accel_raw.z' src/experiment_runner.cpp
          grep -q 'v46c_mekf_rx180_upright_reinit_dynamic_beta_compare_20260913' src/config.h
      - name: Commit V46c frame fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/experiment_runner.cpp src/config.h
          git commit -m "Use Rx180 body frame for V46c MEKF"
          git push origin HEAD:main
